name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Build static product preview
        run: bash site/build-preview.sh "$RUNNER_TEMP/temple-product-preview"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/temple-product-preview
      - id: deployment
        uses: actions/deploy-pages@v4
