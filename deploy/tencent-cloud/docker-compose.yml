# 腾讯云轻量/CVM 上的单机部署（Docker）
# 用法：docker compose up -d
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: temple-guide:latest
    container_name: temple-guide
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      PROACTIVE_ENABLED: "1"        # 提醒/定时任务；不用可改 0
      CHAT_RATE_PER_MIN: "30"
    volumes:
      - ./data:/app/data             # 记忆/指标/评测都在这里，务必保留
    ports:
      # 有 nginx 时只监听本机；直接 IP 访问改成 "8787:8787"
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
